<div class="min-h-screen bg-[#FFF7ED] flex justify-center px-4 py-10">
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-md p-6 sm:p-8">
  
      <!-- Header -->
      <div class="flex gap-4 mb-8">
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-orange-100 text-orange-600 text-xl">
          <mat-icon class="material-symbols-outlined">chef_hat</mat-icon>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-semibold text-gray-900">
            Register as Tiffin Provider
          </h1>
          <p class="text-sm text-gray-600 mt-1">
            Join Foodeta and start serving delicious tiffin meals to customers in Canada
          </p>
        </div>
      </div>
  
      <!-- Account Information -->
      <h2 class="text-lg font-semibold text-gray-900 mb-4">
        Account Information
      </h2>
  
      <!-- Flex row -->
      <div class="flex flex-wrap -mx-2">
        <div class="w-full sm:w-1/2 px-2 mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Contact Name *
          </label>
          <input
            type="text" [field]="rform.owner_name"
            placeholder="Your full name"
            class="w-full rounded-lg bg-gray-100 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-400"
          />
        </div>
  
        <div class="w-full sm:w-1/2 px-2 mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Email *
          </label>
          <input
            type="email" [field]="rform.email"
            placeholder="your@email.com"
            class="w-full rounded-lg bg-gray-100 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-400"
          />
        </div>
  
        <div class="w-full sm:w-1/2 px-2 mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Phone Number *
          </label>
          <input
            type="tel" [field]="rform.phone_number"
            placeholder="+1 (XXX) XXX-XXXX"
            class="w-full rounded-lg bg-gray-100 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-400"
          />
        </div>
  
        <div class="w-full sm:w-1/2 px-2 mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Password *
          </label>
          <input
            type="password" [field]="rform.password"
            placeholder="Min. 6 characters"
            class="w-full rounded-lg bg-gray-100 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-400"
          />
        </div>
      </div>
  
      <hr class="my-8" />
  
      <!-- Business Information -->
      <h2 class="text-lg font-semibold text-gray-900 mb-4">
        Business Information
      </h2>
  
      <div class="flex flex-wrap -mx-2">
        <div class="w-full px-2 mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Business / Tiffin Service Name *
          </label>
          <input
            type="text" [field]="rform.business_name"
            placeholder="e.g., Gujarat Bhavan Kitchen"
            class="w-full rounded-lg bg-gray-100 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-400"
          />
        </div>
  
        <div class="w-full px-2 mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Description *
          </label>
          <textarea
            rows="3" [field]="rform.description"
            placeholder="Describe your tiffin service, specialties, and what makes you unique..."
            class="w-full rounded-lg bg-gray-100 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-400"
          ></textarea>
        </div>
  
        <div class="w-full sm:w-1/2 px-2 mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Primary Location *
          </label>
          <select
            class="w-full rounded-lg bg-gray-100 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-400"
            [field]="rform.address"
          >
          <option>Select city</option>
          @for(loc of primary_location; track loc) {
            <option >{{ loc }}</option>
          }
          </select>
        </div>
  
        <!-- <div class="w-full sm:w-1/2 px-2 mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Price Per Day (CAD) *
          </label>
          <input
            type="number" [field]="rform.price_per_day"
            placeholder="$ 12.00"
            class="w-full rounded-lg bg-gray-100 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-400"
          />
        </div> -->
      </div>
  
      <!-- Delivery Areas -->
      <!-- <div class="mt-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Delivery Areas * (Select all that apply)
        </label>
  
        <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm">
            @for(loc of delivery_areas;track loc) {
                <label class="flex items-center gap-2">
                    <input type="checkbox"
                    [checked]="isSelected(loc)"
                    (change)="toggleDeliveryArea(loc, $event.target.checked)"
                    /> {{loc}}
                </label>
            }
        </div>
      </div> -->
  
      <!-- Image URL -->
      <div class="mt-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Business Image URL (Optional)
        </label>
        <input
          type="url" [field]="rform.image_url"
          placeholder="https://example.com/your-image.jpg"
          class="w-full rounded-lg bg-gray-100 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-400"
        />
        <!-- <p class="text-xs text-gray-500 mt-1">
          You can add a photo URL for your business (upload coming soon)
        </p> -->
      </div>
  
      <!-- Actions -->
      <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-end">
        <button
          class="w-full sm:w-auto px-6 py-2 rounded-lg border text-sm hover:bg-gray-50"
        >
          Cancel
        </button>
  
        <button
          class="w-full sm:w-auto px-6 py-2 rounded-lg bg-black text-white text-sm hover:opacity-80"
          (click)="onSubmit()"
        >
          Register Provider
        </button>
      </div>
  
    </div>
  </div>
