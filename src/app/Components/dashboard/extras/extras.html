<div class="min-h-screen bg-[#FFF7ED] px-4 py-6">
    <!-- MAIN CARD -->
    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-sm p-6">
  
      <!-- Header -->
      <div class="flex justify-between items-start mb-6">
        <div>
          <h2 class="text-lg font-semibold">Extras Management</h2>
          <p class="text-sm text-gray-500">
            Manage additional items customers can order
          </p>
        </div>
  
        <div class="flex gap-2">
          <button class="px-4 py-2 rounded-lg border text-sm">
            Cancel
          </button>
          <button class="px-4 py-2 rounded-lg bg-black text-white text-sm flex items-center gap-2">
            💾 Save Extras
          </button>
        </div>
      </div>
  
      <!-- Existing Extras -->
      <div class="space-y-4 mb-8">
  
        <!-- Extra Item -->
        <div class="flex justify-between items-center border rounded-xl p-4">
          <div>
            <p class="font-medium">Extra Rotli</p>
            <p class="text-sm text-gray-500">$0.50/piece • 2 pieces</p>
          </div>
          <button class="text-red-500 hover:opacity-70">🗑</button>
        </div>
  
        <div class="flex justify-between items-center border rounded-xl p-4">
          <div>
            <p class="font-medium">Extra Rice</p>
            <p class="text-sm text-gray-500">$2.00/portion • One bowl</p>
          </div>
          <button class="text-red-500 hover:opacity-70">🗑</button>
        </div>
  
        <div class="flex justify-between items-center border rounded-xl p-4">
          <div>
            <p class="font-medium">Extra Papad</p>
            <p class="text-sm text-gray-500">$0.50/piece • 2 pieces</p>
          </div>
          <button class="text-red-500 hover:opacity-70">🗑</button>
        </div>
  
        <div class="flex justify-between items-center border rounded-xl p-4">
          <div>
            <p class="font-medium">Extra Sweet</p>
            <p class="text-sm text-gray-500">$3.00/portion</p>
          </div>
          <button class="text-red-500 hover:opacity-70">🗑</button>
        </div>
  
      </div>
  
      <!-- Add New Extra -->
      <div class="border-2 border-dashed rounded-xl p-6">
  
        <h3 class="font-medium mb-4">Add New Extra</h3>
  
        <div class="flex flex-wrap -mx-2">
  
          <div class="w-full sm:w-1/3 px-2 mb-4">
            <label class="text-sm font-medium">Extra Name *</label>
            <input
              type="text"
              placeholder="e.g., Extra Rotli"
              class="w-full mt-1 rounded-lg bg-gray-100 px-4 py-2 text-sm"
            />
          </div>
  
          <div class="w-full sm:w-1/3 px-2 mb-4">
            <label class="text-sm font-medium">Price (CAD) *</label>
            <input
              type="number"
              placeholder="2.00"
              class="w-full mt-1 rounded-lg bg-gray-100 px-4 py-2 text-sm"
            />
          </div>
  
          <div class="w-full sm:w-1/3 px-2 mb-4">
            <label class="text-sm font-medium">Unit *</label>
            <select class="w-full mt-1 rounded-lg bg-gray-100 px-4 py-2 text-sm">
              <option>Portion</option>
              <option>Piece</option>
              <option>Bowl</option>
            </select>
          </div>
  
          <div class="w-full px-2 mb-4">
            <label class="text-sm font-medium">Description (Optional)</label>
            <input
              type="text"
              placeholder="e.g., 2 pieces"
              class="w-full mt-1 rounded-lg bg-gray-100 px-4 py-2 text-sm"
            />
          </div>
  
        </div>
  
        <button class="px-4 py-2 rounded-lg bg-black text-white text-sm flex items-center gap-2">
          ➕ Add Extra
        </button>
  
      </div>
  
    </div>
  </div>
