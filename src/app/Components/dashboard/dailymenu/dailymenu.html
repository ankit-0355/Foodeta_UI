<div class="min-h-screen bg-[#FFF7ED] px-4 py-6">
  <!-- MAIN CARD -->
  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-sm p-6">
    <!-- Header -->
    <div class="flex justify-between items-start mb-6">
      <div>
        <h2 class="text-lg font-semibold">Today's Menu</h2>
        <p class="text-sm text-gray-500">Manage your daily tiffin menu items</p>
      </div>

      <div class="flex gap-2">
        @if(editMenu()){
        <button class="px-4 py-2 rounded-lg border text-sm" (click)="toggleEdit()">Cancel</button>
        <button
          class="px-4 py-2 rounded-lg bg-black text-white text-sm flex items-center gap-2"
          (click)="saveMenu()"
        >
          💾 Save Extras
        </button>
        } @else {
        <button
          class="px-4 py-2 rounded-lg bg-black text-white text-sm flex items-center gap-2"
          (click)="toggleEdit()"
        >
          Edit Menu
        </button>
        }
      </div>
    </div>

    <!-- Add New item -->
    @if(editMenu()){
    <div class="border-2 border-dashed rounded-xl px-4 py-2 mb-4">
      <div class="flex justify-between">
        <h3 class="font-medium">Add New Item</h3>
        <button class="px-4 py-2 rounded-lg bg-black text-white text-sm flex items-center gap-2"
        (click)="addMenuItem()"
        >
          ➕ Add Extra
        </button>
      </div>

      <div class="flex flex-wrap -mx-2">
        <div class="w-full sm:w-1/3 px-2 mb-4">
          <label class="text-sm font-medium">Item Name *</label>
          <input [field]="menuItemform.name"
            type="text"
            placeholder="e.g., Extra Rotli"
            class="w-full mt-1 rounded-lg bg-gray-100 px-4 py-2 text-sm"
          />
        </div>

        <div class="w-full px-2 mb-2">
          <label class="text-sm font-medium">Description (Optional)</label>
          <textarea [field]="menuItemform.description"
            type="text"
            placeholder="e.g., 2 pieces"
            class="w-full mt-1 rounded-lg bg-gray-100 px-4 py-2 text-sm"
          ></textarea>
        </div>
      </div>
    </div>
    }

    <!-- Existing Extras -->
    <div class="space-y-4 mb-8">
        @if(items().length <= 0){
            <div class="flex justify-center my-10">
            <p class = "text-lg font-semibold">
                No Menu Item to Display
            </p>
            </div>
        }
      @for(item of items(); track item.name) {
      <!-- Menu Item -->
      <div class="flex justify-between items-center border rounded-xl p-4">
        <div>
          <p class="font-medium">{{ item.name }}</p>
          <p class="text-sm text-gray-500">{{ item.description }}</p>
        </div>
        <button class="text-red-500 hover:opacity-70"
        (click)="removeMenuItem(item)"
        >🗑</button>
      </div>
      }
    </div>
  </div>
</div>
